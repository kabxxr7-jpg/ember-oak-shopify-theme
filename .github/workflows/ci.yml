name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests (quiz scoring, locator maths and cache)
        run: node --test tests/*.test.mjs
      - name: Theme check
        run: npx -y @shopify/cli@5.0.1 theme check --path theme --fail-level error
